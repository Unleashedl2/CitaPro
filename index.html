<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CitaPro</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#b4532a">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mu:#6f675d;--ac:#b4532a;--ac2:#fff;--bd:#e6ded2;--ok:#2f7d4f;--wa:#b7791f;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16130f;--card:#221e19;--tx:#f3ece2;--mu:#a69c8e;--ac:#e07a4a;--ac2:#1a1209;--bd:#3a332b;--ok:#5cc489;--wa:#e2b45a;--er:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16130f;--card:#221e19;--tx:#f3ece2;--mu:#a69c8e;--ac:#e07a4a;--ac2:#1a1209;--bd:#3a332b;--ok:#5cc489;--wa:#e2b45a;--er:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.er{color:var(--er)}
button:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabs .on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.opt{padding:0;overflow:hidden;text-align:center}.opt .t{padding:9px}.opt img{width:100%;height:90px;object-fit:cover;display:block}
.opt.on{outline:2px solid var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{padding:9px 0}.cal .h{font-size:12px;color:var(--mu);padding:4px 0}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.s-pend{color:var(--wa)}.s-ok{color:var(--ok)}.s-no{color:var(--er)}
.n{border-left:4px solid var(--ac)}.n.r{opacity:.65;border-left-color:var(--bd)}
.bell{position:relative}.bell i{position:absolute;top:-6px;right:-6px;background:var(--er);color:#fff;border-radius:99px;font-size:11px;font-style:normal;padding:1px 6px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp .card{margin:0}.kp b{font-size:24px;display:block}
.bar{height:12px;border-radius:6px;background:var(--ac);margin:4px 0 10px}
.st{font-size:26px;background:none;border:0;padding:0 2px;color:var(--bd)}.st.on{color:#e6a700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bd)}
</style></head>
<body><div class="w" id="app"><p class="mu">Cargando…</p></div><div id="toast"></div>
<script>
const CAT={barberia:{n:'Barbería',i:'💈',s:[['Corte de cabello',8],['Barba',5],['Corte + barba',12],['Cejas',3]]},
 peluqueria:{n:'Peluquería',i:'💇',s:[['Corte',15],['Tinte',40],['Brushing',12],['Tratamiento capilar',25]]},
 manicure:{n:'Manicure',i:'💅',s:[['Manos',10],['Pies',12],['Completo (manos y pies)',20]]}};
const PAY=[['transferencia','Transferencia','🏦'],['pagomovil','Pago móvil','📱'],['usdt','USDT','💲'],['efectivo','Efectivo','💵']];
let db,user,assets,meId,meName='',isAdm=false,ready=false,t0=Date.now();
let D={cfg:null,appts:[],blocks:[],notifs:[],anotifs:[],prof:{},pay:{}},prof=null,tab='',bk={},viewM=new Date(),ES=null,msg='',cm={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const start=a=>{const[y,m,d]=a.date.split('-').map(Number);return new Date(y,m-1,d,+a.time.slice(0,2))};
const fmt=a=>start(a).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' a las '+a.time;
const active=a=>a.status!=='cancelada'&&a.status!=='rechazada';
const aid=(d,t)=>d+'_'+t.replace(':','');
const nameOf=id=>D.prof[id]?.name||'Cliente';
const RT=()=>{const t=D.cfg.rateType||'usd';return{t,r:Number(D.cfg.rates?.[t])||0,u:D.cfg.rates?.upd||''}};
const toBs=p=>RT().r?(p*RT().r).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2}):null;
const bsM=m=>m==='pagomovil'||m==='transferencia';
const amtV=sv=>{if(!sv)return '<div class="mu">Elige un servicio para ver el monto.</div>';const bs=toBs(sv.price),R=RT();
 if(!bsM(bk.pay))return `<div style="margin-bottom:10px">Monto a pagar: <b>$${sv.price}</b></div>`;
 return bs?`<div style="margin-bottom:10px">Monto a pagar: <b>$${sv.price}</b><br><b style="font-size:20px">Bs. ${bs}</b><div class="mu">Tasa BCV ${R.t==='eur'?'euro':'dólar'}: Bs. ${R.r} · actualizada ${esc(R.u)}</div></div>`:'<div class="s-no">El negocio aún no cargó la tasa BCV. Intenta más tarde o paga en USDT o efectivo.</div>'};
const slots=()=>{const o=[];for(let h=D.cfg.from;h<D.cfg.to;h++)o.push(pad(h)+':00');return o};
const taken=(d,t)=>D.appts.some(a=>a.id===aid(d,t)&&active(a))||D.blocks.some(b=>b.date===d&&(b.time==='all'||b.time===t));
const safe=async f=>{try{return await f()}catch(e){msg='Error: '+(e.message||e.code);render()}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000);try{if(window.Notification&&Notification.permission==='granted')new Notification('CitaPro',{body:t})}catch(e){}}
const notif=(to,text)=>db.doc('notifs/n'+Date.now()+Math.floor(Math.random()*999)).set({to,text,ts:Date.now(),read:false});
const anotif=(text,apptId)=>db.doc('anotifs/n'+Date.now()+Math.floor(Math.random()*999)).set({text,apptId:apptId||null,ts:Date.now(),read:false});

let AU={mode:'login',step:1,err:''};
const normPhone=p=>{let d=String(p).replace(/[^\d+]/g,'');if(d[0]==='+')return d;d=d.replace(/^0+/,'');return d.startsWith('58')?'+'+d:'+58'+d};
async function api(a,data){const r=await fetch('api.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'citapro'},body:JSON.stringify(data||{}),credentials:'same-origin'});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Error de conexión'),{status:r.status});return j}
db={doc:p=>({get:async()=>{const j=await api('doc',{op:'get',path:p});return{exists:j.exists,data:()=>j.data}},
 set:async d=>{await api('doc',{op:'set',path:p,data:d});refresh(true)},
 update:async d=>{await api('doc',{op:'update',path:p,data:d});refresh(true)},
 delete:async()=>{await api('doc',{op:'delete',path:p});refresh(true)}})};
assets={upload:async b=>{const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});const r=await api('upload',{data:d});return{id:r.url}}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let rev=0,seenN=new Set(),polling=null;

function authV(){const m=AU.mode,E=AU.err?`<div style="color:var(--er);margin-bottom:8px">${esc(AU.err)}</div>`:'';
 const h='<div style="text-align:center;margin:26px 0 10px"><div style="font-size:44px">💈</div><h1>CitaPro</h1></div>',back=`<p class="mu" style="cursor:pointer" onclick="AU={mode:'login',step:1,err:''};render()">← Volver</p>`;
 if(m==='change')return h+`<div class="card"><b>Crea tu contraseña privada</b><p class="mu">Es tu primer inicio de sesión. Elige una contraseña nueva (mín. 8 caracteres, distinta de 123456) y tu teléfono para poder recuperarla.</p><label>Teléfono</label><input id="cp" type="tel" placeholder="0412 1234567"><label>Nueva contraseña</label><input id="c1" type="password"><label>Repite la contraseña</label><input id="c2" type="password">${E}<button class="p" style="width:100%" onclick="doChange()">Guardar y entrar</button></div>`;
 if(m==='reg')return h+`<div class="card"><label>Nombre completo</label><input id="rn"><label>Teléfono (para recuperar la contraseña)</label><input id="rt" type="tel" placeholder="0412 1234567"><label>Cédula</label><input id="rc2"><label>Usuario</label><input id="ru" autocapitalize="off"><label>Contraseña (mín. 6)</label><input id="rp" type="password">${E}<button class="p" style="width:100%" onclick="doReg()">Crear cuenta</button>${back}</div>`;
 if(m==='forgot')return h+`<div class="card"><b>Recuperar contraseña</b>${AU.step===1?`<label>Teléfono registrado</label><input id="fp" type="tel" placeholder="0412 1234567">${E}<button class="p" style="width:100%" onclick="sendCode()">Enviar código por SMS</button>`:`<p class="mu">Enviamos un código a ${esc(AU.ph)}.</p><label>Código</label><input id="fc" inputmode="numeric"><label>Nueva contraseña (mín. 6)</label><input id="fn" type="password">${E}<button class="p" style="width:100%" onclick="resetPw()">Restablecer y entrar</button>`}${back}</div>`;
 return h+`<div class="card"><label>Usuario</label><input id="lu" autocapitalize="off"><label>Contraseña</label><input id="lp" type="password">${E}<button class="p" style="width:100%" onclick="doLogin()">Entrar</button><p class="mu" style="cursor:pointer" onclick="AU={mode:'forgot',step:1,err:''};render()">¿Olvidaste tu contraseña?</p><p class="mu" style="cursor:pointer" onclick="AU={mode:'reg',step:1,err:''};render()">Crear cuenta nueva</p></div>`}
async function doLogin(){try{await api('login',{username:$('#lu').value,password:$('#lp').value});await startApp()}catch(e){AU.err=e.message;render()}}
async function doReg(){const g=i=>$('#'+i).value.trim(),n=g('rn'),t=g('rt'),u=g('ru'),p=$('#rp').value;
 if(!n||!t||!u||p.length<6){AU.err='Completa todos los campos (contraseña mín. 6).';return render()}
 try{await api('register',{name:n,phone:normPhone(t),ci:g('rc2'),username:u,password:p});await startApp()}catch(e){AU.err=e.message;render()}}
async function sendCode(){AU.ph=normPhone($('#fp').value);try{await api('forgotStart',{phone:AU.ph});AU.step=2;AU.err=''}catch(e){AU.err=e.message}render()}
async function resetPw(){const np=$('#fn').value;if(np.length<6){AU.err='La contraseña debe tener al menos 6 caracteres.';return render()}
 try{await api('forgotConfirm',{phone:AU.ph,code:$('#fc').value.trim(),newPassword:np});await startApp()}catch(e){AU.err=e.message;render()}}
function logout(){clearInterval(polling);api('logout').catch(()=>{}).finally(()=>{meId=null;isAdm=false;isMaster=false;MS='';D={cfg:null,appts:[],blocks:[],notifs:[],anotifs:[],prof:{},pay:{}};prof=null;tab='';bk={};rev=0;seenN=new Set();AU={mode:'login',step:1,err:''};render()})}
async function enablePush(){try{if(await Notification.requestPermission()==='granted')toast('Avisos activados.')}catch(e){}render()}
const passCard=()=>`<div class="card"><b>Cambiar mi contraseña</b><label>Contraseña actual</label><input id="po" type="password"><label>Nueva (mín. 8)</label><input id="pn1" type="password"><button class="p" onclick="changePass()">Cambiar</button></div>`;
async function changePass(){try{await api('changePass',{old:$('#po').value,new:$('#pn1').value});toast('Contraseña actualizada.');$('#po').value='';$('#pn1').value=''}catch(e){toast(e.message)}}
let CU=null,isMaster=false,MS='';
async function doChange(){const p=$('#cp').value.trim(),a=$('#c1').value,b=$('#c2').value;
 if(!p){AU.err='Indica tu teléfono.';return render()}
 if(a.length<8||a==='123456'||a!==b){AU.err='La contraseña debe tener al menos 8 caracteres, ser distinta de 123456 y coincidir en ambos campos.';return render()}
 try{await api('firstChange',{newPassword:a,phone:normPhone(p)});await startApp()}catch(e){AU.err=e.message;render()}}
async function resetUser(id){try{const r=await api('masterReset',{uid:id});MS=`Contraseña temporal de ${nameOf(id)}: ${r.tmp} (deberá cambiarla al entrar)`}catch(e){MS='Error: '+e.message}render()}
function masterV(){const T=[['cuentas','Cuentas'],['mcitas','Citas'],['neg','Negocio']];if(!T.some(t=>t[0]===tab))tab='cuentas';const rows=Object.entries(D.prof);
 const body=tab==='cuentas'?rows.map(([id,u])=>`<div class="card"><b>${esc(u.name)}</b> <span class="mu">@${esc(u.username||'')} · ${esc(u.phone||'sin teléfono')}</span><br><br><button onclick="resetUser('${id}')">Restablecer contraseña</button></div>`).join('')||'<div class="card mu">Sin cuentas.</div>'
 :tab==='mcitas'?[...D.appts].sort((a,b)=>start(b)-start(a)).map(a=>`<div class="card"><b>${esc(a.svc)} · $${a.price}</b> <span class="bd ${stL[a.status][1]}">${stL[a.status][0]}</span><br>${fmt(a)}<div class="mu">${esc(nameOf(a.client))} · ${PAY.find(x=>x[0]===a.pay)[1]}</div></div>`).join('')||'<div class="card mu">Sin citas.</div>'
 :`<div class="card"><b>${esc(D.cfg?.biz||'Sin configurar')}</b><div class="mu">Servicio: ${esc(D.cfg?.type||'-')} · Horario ${D.cfg?.from}–${D.cfg?.to} · Reservas ${D.cfg?.open===false?'pausadas':'activas'}<br>Citas: ${D.appts.length} · Cuentas: ${rows.length}</div></div>${passCard()}`;
 return `<div class="top"><div><h1>🛠 Soporte Master</h1><div class="mu">Acceso de solo lectura + restablecer contraseñas</div></div><button onclick="logout()">Salir</button></div>
 <div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>${MS?`<div class="card s-pend">${esc(MS)}</div>`:''}${body}`}
async function refresh(force){if(!meId)return;try{const j=await api('snapshot',{rev:force?0:rev});if(j.same)return;rev=j.rev;
 [...j.notifs.map(n=>['n',n]),...j.anotifs.map(n=>['a',n])].forEach(([k,n])=>{const key=k+n.id;if(!seenN.has(key)){seenN.add(key);if(ready&&n.ts>t0)toast(n.text)}});
 D={cfg:j.cfg,appts:j.appts,blocks:j.blocks,notifs:j.notifs,anotifs:j.anotifs,prof:j.prof,pay:j.pay};
 if(!isAdm&&!isMaster)prof=j.prof[meId]||null;ready=true;render()}catch(e){if(e.status===401){meId=null;render()}}}
async function startApp(){try{const j=await api('me');if(!j.user){meId=null;render();return}const u=j.user;
 if(u.mustChange){AU={mode:'change',err:''};meId=null;CU=u;render();return}
 AU={mode:'login',step:1,err:''};meId=u.id;meName=u.name||'';isMaster=u.role==='master';isAdm=u.role==='admin';tab='';ready=false;rev=0;
 await refresh(true);clearInterval(polling);polling=setInterval(()=>refresh(false),5000)}catch(e){msg='Error: '+e.message;render()}}
async function tick(){if(!D.cfg)return;const now=Date.now();
 for(const a of D.appts){if(!(a.status==='confirmada'||a.status==='reservada'))continue;const df=start(a)-now;if(df<=0||df>1*3600e3)continue;
  if(isAdm&&!a.remA){a.remA=true;await safe(async()=>{await db.doc('appts/'+a.id).update({remA:true});await anotif(`⏰ Próxima cita a las ${a.time}: ${nameOf(a.client)} – ${a.svc}.`,a.id)})}
  if(a.client===meId&&!a.remC){a.remC=true;await safe(async()=>{await db.doc('appts/'+a.id).update({remC:true});await notif(meId,`⏰ Recordatorio: tu cita de ${a.svc} es a las ${a.time} (en menos de 1 hora).`)})}}}

function render(){
 const A=$('#app');

 if(!meId){
   A.innerHTML=authV();
   return;
 }

 if(isMaster){
   A.innerHTML=masterV();
   return;
 }

 if(!D.cfg){
   A.innerHTML=isAdm
     ?setupV()
     :'<div class="card">El negocio aún no ha sido configurado por el administrador.</div>';
   return;
 }

 if(!isAdm&&!prof){
   A.innerHTML=profV();
   return;
 }

 const c=CAT[D.cfg.type];

 if(!c){
   A.innerHTML='<div class="card">No se reconoce el tipo de negocio.</div>';
   return;
 }

 if(!tab)tab=isAdm?'panel':'reservar';

 const T=isAdm
 ?[
   ['panel','Panel'],
   ['citas','Citas'],
   ['serv','Servicios'],
   ['agenda','Bloquear'],
   ['clientes','Clientes'],
   ['avisos','Avisos']
 ]
 :[
   ['reservar','Reservar'],
   ['mis','Mis citas'],
   ['avisos','Avisos']
 ];

 const N=(isAdm?D.anotifs:D.notifs).filter(n=>!n.read).length;

 const views={
   reservar:bookV,
   mis:misV,
   avisos:avisosV,
   panel:panelV,
   citas:citasV,
   serv:servV,
   agenda:agendaV,
   clientes:clientesV
 };

 const view=views[tab];
 let content='';

 try{
   if(typeof view!=='function'){
     throw new Error('No existe la vista: '+tab);
   }
   content=view();
 }catch(e){
   console.error('Error al abrir sección '+tab,e);
   content=`
     <div class="card s-no">
       <b>No se pudo abrir esta sección.</b>
       <p>${esc(e.message||'Error desconocido')}</p>
       <button onclick="go('panel')">Volver al panel</button>
     </div>
   `;
 }

 A.innerHTML=`
 <div class="top">
   <div>
     <h1>${c.i} ${esc(D.cfg.biz)}</h1>
     <div class="mu">${esc(isAdm?meName:prof.name)} · ${isAdm?'Administrador':'Cliente'}</div>
   </div>
   <div class="row">
     ${(window.Notification&&Notification.permission==='default')
       ?'<button onclick="enablePush()">Activar avisos</button>':''}
     <button onclick="logout()">Salir</button>
     <button class="bell" onclick="go('avisos')">🔔${N?`<i>${N}</i>`:''}</button>
   </div>
 </div>

 ${D.cfg.open===false
   ?`<div class="card s-no">⛔ ${esc(D.cfg.closedMsg||'Reservas pausadas por vacaciones.')}</div>`
   :''}

 <div style="color:var(--er)">${esc(msg)}</div>

 <div class="tabs">
   ${T.map(t=>`
     <button class="${tab===t[0]?'on':''}"
       onclick="go('${t[0]}')">${t[1]}</button>
   `).join('')}
 </div>

 ${content}
 `;
}

function go(t){
 tab=t;
 msg='';

 if(t==='serv'&&!ES){
   ES=JSON.parse(JSON.stringify(D.cfg.svc));
 }

 render();
}

/* setup / perfil */
function setupV(){return `<h1>Configura tu negocio</h1><div class="card"><label>Nombre del negocio</label><input id="biz">
 <label>Servicio que ofreces</label><div class="grid">${Object.entries(CAT).map(([k,v])=>`<button class="opt ${bk.type===k?'on':''}" onclick="bk.type='${k}';render()"><div class="t">${v.i}<br>${v.n}</div></button>`).join('')}</div><br>
 <div class="row"><div style="flex:1"><label>Desde (hora)</label><input id="hf" type="number" value="9"></div><div style="flex:1"><label>Hasta (hora)</label><input id="ht" type="number" value="19"></div></div>
 <label>Datos para recibir pagos</label><textarea id="pi" rows="3" placeholder="Pago móvil, banco, wallet USDT…"></textarea>
 <button class="p" onclick="doSetup()">Crear negocio</button></div>`}
function doSetup(){const g=i=>$('#'+i).value.trim();if(!bk.type||!g('biz'))return toast('Indica nombre y servicio.');
 safe(()=>db.doc('cfg/main').set({biz:g('biz'),type:bk.type,from:+g('hf'),to:+g('ht'),payInfo:g('pi'),open:true,rateType:'usd',rates:{usd:0,eur:0,upd:''},closedMsg:'Estamos de vacaciones. Pronto abriremos de nuevo.',
  svc:CAT[bk.type].s.map((s,i)=>({id:'s'+i,name:s[0],price:s[1],img:''}))}))}
function profV(){return `<h1>Tus datos</h1><p class="mu">Se guardan en la base de datos para tus reservas.</p><div class="card"><label>Nombre completo</label><input id="pn" value="${esc(meName)}"><label>Teléfono</label><input id="pt" type="tel"><label>Cédula</label><input id="pc"><button class="p" onclick="saveProf()">Guardar</button></div>`}
function saveProf(){const p={name:$('#pn').value.trim(),phone:$('#pt').value.trim(),ci:$('#pc').value.trim()};if(!p.name||!p.phone)return toast('Completa nombre y teléfono.');
 safe(async()=>{await db.doc('profiles/'+meId).set(p);prof=p;render()})}

/* cliente */
function bookV(){if(D.cfg.open===false)return '<div class="card mu">Las reservas están pausadas por ahora.</div>';
 const d=viewM,y=d.getFullYear(),m=d.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=ymd(new Date());
 let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
 for(let i=1;i<=days;i++){const s=`${y}-${pad(m+1)}-${pad(i)}`;cells+=`<button class="${bk.date===s?'p':''}" ${s<today?'disabled':''} onclick="bk.date='${s}';bk.time=null;render()">${i}</button>`}
 const dg=bk.pay&&bk.pay!=='efectivo',sv=D.cfg.svc.find(s=>s.id===bk.svc);
 return `<h2>1. Servicio</h2><div class="grid">${D.cfg.svc.map(s=>`<button class="opt ${bk.svc===s.id?'on':''}" onclick="bk.svc='${s.id}';render()">${s.img?`<img src="${s.img}" alt="">`:''}<div class="t"><b>${esc(s.name)}</b><br><span class="mu">$${s.price}</span></div></button>`).join('')}</div>
 <h2>2. Día</h2><div class="card"><div class="top" style="margin-bottom:8px"><button onclick="viewM=new Date(${y},${m-1},1);render()">‹</button><b>${d.toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button onclick="viewM=new Date(${y},${m+1},1);render()">›</button></div>
 <div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></div>
 ${bk.date?`<h2>3. Hora</h2><div class="grid">${slots().map(t=>{const[yy,mm,dd]=bk.date.split('-').map(Number),past=new Date(yy,mm-1,dd,+t.slice(0,2))<=new Date();return `<button class="${bk.time===t?'p':''}" ${past||taken(bk.date,t)?'disabled':''} onclick="bk.time='${t}';render()">${t}</button>`}).join('')}</div>`:''}
 ${bk.time?`<h2>4. Método de pago</h2><div class="grid">${PAY.map(p=>`<button class="opt ${bk.pay===p[0]?'on':''}" onclick="bk.pay='${p[0]}';render()"><div class="t">${p[2]}<br>${p[1]}</div></button>`).join('')}</div>
 ${dg?`<div class="card">${amtV(sv)}${D.cfg.payInfo?`<div class="mu">Datos para pagar:</div><div style="white-space:pre-wrap;margin-bottom:10px"><b>${esc(D.cfg.payInfo)}</b></div>`:''}
 <label>Número de referencia</label><input value="${esc(bk.ref)}" oninput="bk.ref=this.value"><label>Banco utilizado</label><input value="${esc(bk.bank)}" oninput="bk.bank=this.value">
 <label>Nombre del titular</label><input value="${esc(bk.pn??prof.name)}" oninput="bk.pn=this.value"><label>Número de cédula</label><input value="${esc(bk.ci??prof.ci)}" oninput="bk.ci=this.value"></div>`:''}
 ${bk.pay?`<div class="card"><b>${sv?esc(sv.name)+' · $'+sv.price:'Elige un servicio'}</b> · ${bk.date} · ${bk.time}<br><br><button class="p" style="width:100%" onclick="submitB()">${dg?'Procesar pago y reservar':'Reservar (efectivo)'}</button></div>`:''}`:''}`}
function submitB(){const sv=D.cfg.svc.find(s=>s.id===bk.svc),dg=bk.pay!=='efectivo';
 if(!sv)return toast('Elige un servicio.');if(bsM(bk.pay)&&!RT().r)return toast('Aún no hay tasa BCV cargada.');
 const P={ref:(bk.ref||'').trim(),bank:(bk.bank||'').trim(),payName:(bk.pn??prof.name).trim(),ci:(bk.ci??prof.ci??'').trim()};
 if(dg&&(!P.ref||!P.bank||!P.payName||!P.ci))return toast('Completa referencia, banco, nombre y cédula.');
 safe(async()=>{const id=aid(bk.date,bk.time),cur=await db.doc('appts/'+id).get();if((cur.exists&&active(cur.data()))||taken(bk.date,bk.time)){toast('Esa hora ya fue tomada.');return}
  const a={date:bk.date,time:bk.time,svcId:sv.id,svc:sv.name,price:sv.price,bsAmt:bsM(bk.pay)?toBs(sv.price):'',rate:bsM(bk.pay)?RT().r:0,rtype:RT().t,client:meId,pay:bk.pay,status:dg?'pendiente':'reservada',created:Date.now()};
  await db.doc('appts/'+id).set(a);if(dg)await db.doc('pay/'+id).set({...P,client:meId});
  await anotif(dg?`💳 Pago por verificar – ${prof.name} (C.I. ${P.ci}). ${PAY.find(p=>p[0]===bk.pay)[1]} ${a.bsAmt?'Bs. '+a.bsAmt+' (tasa '+a.rate+')':'$'+sv.price}, ref. ${P.ref}, banco ${P.bank}, titular ${P.payName}. Cita: ${fmt(a)}.`:`📅 Nueva cita en efectivo – ${prof.name}, ${a.svc}. ${fmt(a)}.`,dg?id:null);
  await notif(meId,dg?`Recibimos tu pago. Te avisaremos cuando sea verificado. Cita: ${fmt(a)}.`:`Cita reservada: ${a.svc}, ${fmt(a)}. Pagas en efectivo en el local.`);
  bk={};tab='mis';render()})}
const stL={pendiente:['Pago en verificación','s-pend'],confirmada:['Confirmada','s-ok'],reservada:['Reservada (efectivo)','s-ok'],completada:['Completada','s-ok'],cancelada:['Cancelada','s-no'],rechazada:['Pago rechazado','s-no']};
const canDone=a=>(a.status==='confirmada'||a.status==='reservada')&&(isAdm||start(a)<=new Date());
function stars(a){const r=a.rating||0;return `<div>${[1,2,3,4,5].map(n=>`<button class="st ${n<=r?'on':''}" ${a.client!==meId||a.rating?'disabled':''} onclick="rate('${a.id}',${n})">★</button>`).join('')}</div>`}
function misV(){const l=D.appts.filter(a=>a.client===meId).sort((a,b)=>start(a)-start(b));
 return l.length?l.map(a=>`<div class="card"><div class="top"><b>${esc(a.svc)} · $${a.price}</b><span class="bd ${stL[a.status][1]}">${stL[a.status][0]}</span></div>${fmt(a)}
 <div class="row" style="margin-top:8px">${canDone(a)?`<button class="ok" onclick="finish('${a.id}')">✔ Finalizar cita</button>`:''}${active(a)&&a.status!=='completada'&&start(a)>new Date()?`<button class="er" onclick="cancelA('${a.id}')">Cancelar</button>`:''}</div>
 ${a.status==='completada'?`<div class="mu" style="margin-top:8px">${a.rating?'Tu evaluación:':'Evalúa el servicio:'}</div>${stars(a)}${a.rating?(a.comment?`<div class="mu">“${esc(a.comment)}”</div>`:''):`<input placeholder="Comentario (opcional)" oninput="cm['${a.id}']=this.value">`}`:''}</div>`).join(''):'<div class="card mu">Aún no tienes citas.</div>'}
function finish(id){safe(async()=>{const a=D.appts.find(x=>x.id===id);await db.doc('appts/'+id).update({status:'completada',doneBy:isAdm?'admin':'cliente',doneAt:Date.now()});
 if(isAdm)await notif(a.client,`✅ Tu cita de ${a.svc} fue finalizada. ¡Evalúa el servicio con estrellas en Mis citas!`);else await anotif(`✅ ${nameOf(a.client)} finalizó su cita de ${a.svc} (${a.date} ${a.time}).`,id)})}
function rate(id,n){safe(async()=>{await db.doc('appts/'+id).update({rating:n,comment:(cm[id]||'').trim()});await anotif(`⭐ ${nameOf(D.appts.find(x=>x.id===id).client)} te dio ${n} estrella${n>1?'s':''}.`,id)})}
function cancelA(id){safe(async()=>{const a=D.appts.find(x=>x.id===id);await db.doc('appts/'+id).update({status:'cancelada'});
 if(isAdm)await notif(a.client,`Tu cita de ${a.svc} (${fmt(a)}) fue cancelada por el negocio.`);else await anotif(`❌ ${nameOf(a.client)} canceló su cita: ${fmt(a)}.`)})}

/* admin */
const incOK=a=>(a.status==='confirmada'||a.status==='completada')&&(a.pay!=='efectivo'||a.status==='completada');
function panelV(){const n=new Date(),td=ymd(n),mk=td.slice(0,7),pk=ymd(new Date(n.getFullYear(),n.getMonth()-1,1)).slice(0,7);
 const sum=f=>D.appts.filter(a=>incOK(a)&&f(a.date)).reduce((s,a)=>s+Number(a.price),0);
 const day=sum(d=>d===td),mo=sum(d=>d.slice(0,7)===mk),pm=sum(d=>d.slice(0,7)===pk),mx=Math.max(mo,pm,1);
 const res=D.appts.filter(a=>a.date===td&&active(a)).length,pen=D.appts.filter(a=>a.status==='pendiente').length;
 const rt=D.appts.filter(a=>a.rating),avg=rt.length?(rt.reduce((s,a)=>s+a.rating,0)/rt.length).toFixed(1):'–';
 const diff=pm?Math.round((mo-pm)/pm*100):null,open=D.cfg.open!==false;
 return `<div class="kp"><div class="card"><span class="mu">Citas reservadas hoy</span><b>${res}</b></div><div class="card"><span class="mu">Ingresos de hoy</span><b>$${day}</b></div>
 <div class="card"><span class="mu">Pagos por verificar</span><b>${pen}</b></div><div class="card"><span class="mu">Valoración promedio</span><b>${avg} ★</b><span class="mu">${rt.length} evaluaciones</span></div></div>
 <div class="card"><b>Comparativo mensual</b><div class="top" style="margin-top:8px"><span>Mes anterior</span><b>$${pm}</b></div><div class="bar" style="width:${pm/mx*100}%;opacity:.5"></div>
 <div class="top"><span>Mes en curso</span><b>$${mo}</b></div><div class="bar" style="width:${mo/mx*100}%"></div>
 <div class="mu">${diff===null?'Sin datos del mes anterior para comparar.':(diff>=0?'▲ ':'▼ ')+Math.abs(diff)+'% frente al mes anterior'}</div>
 <div class="mu">Cuenta como ingreso: pagos digitales confirmados y citas en efectivo completadas, según la fecha de la cita.</div></div>
 <div class="card"><b>Tasa BCV para pagos en Bs</b><div class="row"><div style="flex:1"><label>Dólar (Bs por $)</label><input id="rusd" type="number" step="0.01" value="${D.cfg.rates?.usd||''}"></div><div style="flex:1"><label>Euro (Bs por €)</label><input id="reur" type="number" step="0.01" value="${D.cfg.rates?.eur||''}"></div></div><label>Tasa a usar para cobrar</label><select id="rtp"><option value="usd" ${RT().t==='usd'?'selected':''}>Dólar BCV</option><option value="eur" ${RT().t==='eur'?'selected':''}>Euro BCV</option></select><button class="p" onclick="saveRates()">Guardar tasa</button><div class="mu">Última actualización: ${esc(D.cfg.rates?.upd||'sin datos')}. Consulta el valor oficial en bcv.org.ve</div></div>
 <div class="card"><b>${open?'Reservas activas':'Reservas pausadas (vacaciones)'}</b><label>Mensaje para los clientes cuando estén pausadas</label><input id="cmsg" value="${esc(D.cfg.closedMsg)}">
 <button class="${open?'er':'ok'}" onclick="toggleOpen()">${open?'Pausar reservas':'Reactivar reservas'}</button></div>${passCard()}`}
function saveRates(){safe(()=>db.doc('cfg/main').update({rateType:$('#rtp').value,rates:{usd:+$('#rusd').value||0,eur:+$('#reur').value||0,upd:new Date().toLocaleString('es')}}))}
function toggleOpen(){safe(()=>db.doc('cfg/main').update({open:D.cfg.open===false,closedMsg:$('#cmsg').value.trim()}))}
function citasV(){const sorted=[...D.appts].sort((a,b)=>start(a)-start(b)),up=sorted.filter(a=>active(a)&&a.status!=='completada'),hi=sorted.filter(a=>!up.includes(a)).reverse();
 const card=a=>{const p=D.pay[a.id],pr=D.prof[a.client]||{};return `<div class="card"><div class="top"><b>${esc(a.svc)} · $${a.price}</b><span class="bd ${(stL[a.status]||['Estado desconocido','s-pend'])[1]}">${(stL[a.status]||['Estado desconocido'])[0]}</span></div>${fmt(a)}<br>
 <span class="mu">${esc(pr.name||'Cliente')} · ${esc(pr.phone||'')} · ${(PAY.find(x=>x[0]===a.pay)||['','Método no indicado'])[1]}</span>
 ${a.bsAmt?`<div class="mu">Monto: $${a.price} = Bs. ${a.bsAmt} (tasa ${a.rate})</div>`:''}${p?`<div class="mu">Ref: ${esc(p.ref)} · Banco: ${esc(p.bank)} · Titular: ${esc(p.payName)} · C.I.: ${esc(p.ci)}</div>`:''}${a.rating?`<div>${'★'.repeat(a.rating)}${'☆'.repeat(5-a.rating)} <span class="mu">${esc(a.comment||'')}</span></div>`:''}
 <div class="row" style="margin-top:8px">${a.status==='pendiente'?`<button class="ok" onclick="verify('${a.id}')">✔ Confirmar pago</button><button class="er" onclick="reject('${a.id}')">Rechazar</button>`:''}${canDone(a)?`<button class="ok" onclick="finish('${a.id}')">✔ Finalizar cita</button>`:''}${active(a)&&a.status!=='completada'?`<button class="er" onclick="cancelA('${a.id}')">Cancelar</button>`:''}</div></div>`};
 return `<h2>Próximas</h2>${up.map(card).join('')||'<div class="card mu">Sin citas pendientes.</div>'}<h2>Historial</h2>${hi.map(card).join('')||'<div class="card mu">Vacío.</div>'}`}
function verify(id){safe(async()=>{const a=D.appts.find(x=>x.id===id);await db.doc('appts/'+id).update({status:'confirmada'});await notif(a.client,`🎉 ¡Felicidades! Tu pago fue verificado. Tu cita es el ${fmt(a)}.`)})}
function reject(id){safe(async()=>{const a=D.appts.find(x=>x.id===id);await db.doc('appts/'+id).update({status:'rechazada'});await notif(a.client,`Tu pago de la cita del ${fmt(a)} no pudo verificarse. Reserva de nuevo con los datos correctos.`)})}
function servV(){return `<p class="mu">Edita nombres, precios y fotos de presentación (por ejemplo manos y pies).</p>${ES.map((s,i)=>`<div class="card"><div class="row">
 ${s.img?`<img class="ph" src="${s.img}" alt="">`:'<div class="ph"></div>'}<div style="flex:1;min-width:140px"><label>Nombre</label><input value="${esc(s.name)}" oninput="ES[${i}].name=this.value"></div>
 <div style="width:90px"><label>Precio $</label><input type="number" value="${s.price}" oninput="ES[${i}].price=+this.value"></div></div>
 <div class="row"><label class="mu">Foto: <input type="file" accept="image/*" onchange="up(${i},this.files[0])"></label><button class="er" onclick="ES.splice(${i},1);render()">Quitar</button></div></div>`).join('')}
 <div class="row"><button onclick="ES.push({id:'s'+Date.now(),name:'Nuevo servicio',price:0,img:''});render()">+ Añadir opción</button><button class="p" onclick="saveServ()">Guardar cambios</button></div>`}
async function up(i,f){if(!f||!assets)return toast('No se puede subir la foto.');safe(async()=>{const bm=await createImageBitmap(f),k=Math.min(1,700/bm.width),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8)),r=await assets.upload(b);ES[i].img=r.id;render()})}
function saveServ(){safe(async()=>{await db.doc('cfg/main').update({svc:ES});toast('Servicios guardados.')})}
function agendaV(){const d=bk.bd||ymd(new Date());
 return `<div class="card"><label>Fecha</label><input type="date" min="${ymd(new Date())}" value="${d}" onchange="bk.bd=this.value;render()"><div class="grid">${slots().map(t=>{const b=D.blocks.some(x=>x.date===d&&x.time===t),ap=D.appts.some(a=>a.id===aid(d,t)&&active(a));
 return `<button class="${b?'p':''}" ${ap?'disabled':''} onclick="blk('${d}','${t}')">${t}${ap?' · cita':b?' · bloq.':''}</button>`}).join('')}</div><br>
 <div class="row"><button onclick="blk('${d}','all')">${D.blocks.some(x=>x.date===d&&x.time==='all')?'Liberar día completo':'Bloquear día completo'}</button></div></div>`}
function blk(d,t){safe(async()=>{const r=db.doc('blocks/'+aid(d,t==='all'?'all':t));D.blocks.some(x=>x.date===d&&x.time===t)?await r.delete():await r.set({date:d,time:t})})}
function clientesV(){const cl=Object.entries(D.prof);return cl.length?cl.map(([id,u])=>{const l=D.appts.filter(a=>a.client===id&&active(a)).sort((a,b)=>start(a)-start(b));
 return `<div class="card"><b>${esc(u.name)}</b> <span class="mu">${esc(u.phone||'')} · C.I. ${esc(u.ci||'–')}</span>${l.map(a=>`<div class="mu">• ${esc(a.svc)} – ${fmt(a)} (${(stL[a.status]||['Estado desconocido'])[0]})</div>`).join('')||'<div class="mu">Sin citas activas</div>'}</div>`}).join(''):'<div class="card mu">Aún no hay clientes registrados.</div>'}
function avisosV(){const l=(isAdm?D.anotifs:D.notifs).sort((a,b)=>b.ts-a.ts);const col=isAdm?'anotifs':'notifs';
 setTimeout(()=>{l.filter(n=>!n.read).forEach(n=>{n.read=true;db.doc(col+'/'+n.id).update({read:true}).catch(()=>{})})},2000);
 return l.length?l.map(n=>{const a=n.apptId&&D.appts.find(x=>x.id===n.apptId);return `<div class="card n ${n.read?'r':''}">${esc(n.text)}<div class="mu">${new Date(n.ts).toLocaleString('es')}</div>
 ${isAdm&&a&&a.status==='pendiente'?`<br><button class="ok" onclick="verify('${a.id}')">✔ Confirmar pago</button>`:''}</div>`}).join(''):'<div class="card mu">No tienes notificaciones.</div>'}
startApp();
</script></body></html>
