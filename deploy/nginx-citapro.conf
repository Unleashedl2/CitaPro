# /etc/nginx/sites-available/citapro  — CitaPro detrás de nginx (HTTPS, caché, compresión, límites)
# Cambia SU_IP por tu IP fija (solo tú entras a /master/).

limit_req_zone  $binary_remote_addr zone=api:20m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=login:10m  rate=3r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name beta1.fjmsystem.com citapro.fjmsystem.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name citapro.fjmsystem.com;

    ssl_certificate     /etc/letsencrypt/live/citapro.fjmsystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citapro.fjmsystem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 4m;
    server_tokens off;
    limit_conn perip 40;

    # Compresión (JSON y HTML se reducen mucho)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    # Archivos de la app: caché larga; la app se actualiza por versión del service worker
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        proxy_pass http://127.0.0.1:8001;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API: límite de peticiones por IP
    location ~ /api\.php$ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/citapro-proxy.inc;
    }
    # OJO: las rutas con expresión regular tienen prioridad sobre "location /master/",
    # por eso la restricción de IP se repite aquí.
    location ~ /master/api$ {
        allow SU_IP;
        deny all;
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/citapro-proxy.inc;
        proxy_pass http://127.0.0.1:8001;
    }

    # Sala de control: solo tu IP
    location /master/ {
        allow SU_IP;
        deny all;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/citapro-proxy.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/citapro-proxy.inc;
    }
}
